name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Release build
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build BetterBrightness
        run: |
          xcodebuild \
            -project BetterBrightness.xcodeproj \
            -scheme BetterBrightness \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/BetterBrightnessDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
